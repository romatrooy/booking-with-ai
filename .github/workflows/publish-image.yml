# Публикация Docker-образа в GitHub Container Registry.
#
# Запускается:
#   - при push в main (после CI);
#   - вручную через workflow_dispatch (для отладки).
#
# Образ тегируется двумя способами:
#   - latest — для удобства;
#   - <sha> — для воспроизводимости (конкретный коммит).
#
# Собирается сразу под две платформы:
#   - linux/amd64 — серверы, CI;
#   - linux/arm64 — Mac M1/M2, современные серверы.
#
# Аутентификация: встроенный GITHUB_TOKEN с правом packages:write.
# Это работает из коробки, никаких секретов добавлять не нужно.

name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Собрать и опубликовать
    runs-on: ubuntu-latest
    # Разрешаем GITHUB_TOKEN создавать пакеты в GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Настроить buildx
        # GitHub-hosted runners по умолчанию используют «docker» driver,
        # который не поддерживает multi-platform build и экспорт кэша.
        # Переключаемся на «docker-container» с BuildKit.
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.20.2

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false #greenegger не работает в GHCR без opt-in
          # Кэш слоёв ускоряет повторные сборки.
          cache-from: type=gha
          cache-to: type=gha,mode=max